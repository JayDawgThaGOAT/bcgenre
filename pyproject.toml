[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "beets-bcgenre"
version = "0.1.0"
description = "Beets plugin that fetches genre tags from Bandcamp release pages"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "JayDawgThaGOAT", email = "25489150+JayDawgThaGOAT@users.noreply.github.com" },
]
keywords = ["beets", "bandcamp", "genre", "music", "metadata"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "beets>=2.0",
    "beetcamp>=0.20",
    "httpx>=0.27",
    "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/JayDawgThaGOAT/bcgenre"
Repository = "https://github.com/JayDawgThaGOAT/bcgenre"
Issues = "https://github.com/JayDawgThaGOAT/bcgenre/issues"

# Repo root *is* the plugin package; install it as beetsplug.bcgenre so
# `plugins: bcgenre` works after `pip install beets-bcgenre`.
[tool.setuptools]
packages = ["beetsplug.bcgenre"]

[tool.setuptools.package-dir]
"beetsplug.bcgenre" = "."
